name: Set up Docker Buildx (resilient)
description: >-
  Provision a Docker Buildx builder, retrying once on transient failure.
  Wraps docker/setup-buildx-action (pinned) so a flaky builder-provision /
  BuildKit-image-pull blip re-attempts before failing the job, instead of
  redding out a Build job that the change under test cannot affect (#626).
  Keeps the default docker-container driver, which GHA layer cache
  (type=gha,mode=max) and multi-platform builds both require.
  A daemon that HANGS rather than fails never trips that retry, so a
  time-bounded daemon probe runs first (#987). Composite steps cannot take
  `timeout-minutes`, so callers must also set one on the step that uses this
  action as a backstop for the setup-buildx attempts themselves.

runs:
  using: composite
  steps:
    # A wedged daemon hangs `docker version` indefinitely — on 2026-09-20 it
    # held a job for the full 6h runner cap inside setup-buildx-action (#987).
    # Bound it, retry once, then fail with a message that names the cause.
    - name: Probe Docker daemon
      shell: bash
      run: |
        for attempt in 1 2; do
          if command timeout -k 10 60 docker version >/dev/null; then
            exit 0
          fi
          if [ "$attempt" -eq 1 ]; then
            command echo "::warning::Docker daemon did not answer within 60s; retrying in 15s"
            command sleep 15
          fi
        done
        command echo "::error::Docker daemon unresponsive after 2 attempts (60s each) — runner infrastructure fault, re-run the job"
        exit 1

    # First attempt — allowed to fail softly so the retry below can run.
    - name: Set up Docker Buildx (attempt 1)
      id: first
      continue-on-error: true
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

    # Back off before retrying, matching the repo's retry() helper (15s initial
    # delay). Only runs when the first attempt failed.
    - name: Wait before Buildx retry
      if: steps.first.outcome == 'failure'
      shell: bash
      run: |
        command echo "::warning::Docker Buildx setup failed on first attempt (likely a transient builder-provision flake); retrying in 15s"
        command sleep 15

    # Second (hard) attempt — no continue-on-error, so a genuine persistent
    # infra outage still fails the job rather than being masked.
    - name: Set up Docker Buildx (attempt 2)
      if: steps.first.outcome == 'failure'
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
