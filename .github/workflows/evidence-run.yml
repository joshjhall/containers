name: Evidence Run

# Evidence-run workflow (sub-issue D of #473 — matrix + tier integration).
# Builds `luggage` + `record-evidence` from this repo, runs a tool install
# against a published, signed base image at its digest, records a
# TestEntry-shaped row, and hands it to `bin/ingest-evidence.sh` for
# delivery into `joshjhall/containers-db`.
#
# Triggers (all path-scoped to evidence-relevant sources):
#   - pull_request → main : run the matrix in DRY-RUN (validate the row
#     merges cleanly). Fork-safe — needs no secrets.
#   - push → main         : run the matrix and open a real PR against
#     containers-db (requires the `CONTAINERS_DB_PAT` secret).
#   - workflow_dispatch   : ad-hoc single run; the `dry_run` input chooses.
# No cron: per #473, while the catalog is small "just enumerate" beats
# sampling, so the matrix is exhaustive and event-driven.
#
# A `setup` job resolves the matrix (a single input-derived leg for
# dispatch, the enumerated pilot legs for PR/push) and the effective
# dry-run flag, so the `evidence` job body is identical across events.
# Per-leg coordinates are read into `env:` rather than interpolated into
# `run:` scripts — the same guardrail the dispatch prototype used.
#
# Flow per matrix leg:
#   1. Build `luggage` and `record-evidence` from this repo (static musl).
#   2. Pull the base image and capture its `sha256:` digest.
#   3. Run `luggage install <tool>@<version> --json-report` inside the
#      image (binary mounted from the runner per the
#      luggage-release-deferred convention).
#   4. Run `record-evidence` to assemble the TestEntry-shaped row.
#   5. Hand the row to `bin/ingest-evidence.sh` — a dry-run validate, or a
#      real cross-repo push + PR when dry-run is false.

on:
  workflow_dispatch:
    inputs:
      tool:
        description: "Tool slug in containers-db (e.g. rust)"
        required: true
        default: "rust"
      tool_version:
        description: "Tool version (must have a tools/<tool>/versions/<v>.json)"
        required: true
        default: "1.95.0"
      tuple:
        description: "Base image tuple slug"
        required: true
        default: "debian-12-amd64"
        type: choice
        # Every supported base-image tuple (build-base-images.yml matrix;
        # tests/unit/base-images-structure.sh keeps the two in step).
        options:
          - debian-12-amd64
          - debian-12-arm64
          - debian-13-amd64
          - debian-13-arm64
          - ubuntu-24.04-amd64
          - ubuntu-24.04-arm64
          - ubuntu-26.04-amd64
          - ubuntu-26.04-arm64
          - alpine-3.22-amd64
          - alpine-3.22-arm64
          - alpine-3.23-amd64
          - alpine-3.23-arm64
          - alpine-3.24-amd64
          - alpine-3.24-arm64
          - rhel-9-amd64
          - rhel-9-arm64
          - rhel-10-amd64
          - rhel-10-arm64
      image_tag:
        description: "Base image tag to pull"
        required: true
        default: "latest"
      dry_run:
        description: "Skip the actual cross-repo push and PR open"
        required: true
        default: true
        type: boolean
  pull_request:
    branches: [main]
    paths:
      - "crates/luggage/**"
      - "crates/record-evidence/**"
      - "crates/containers-common/**"
      - "base-images/**"
      - "bin/ingest-evidence.sh"
      - "bin/ingest-evidence-batch.sh"
      - "bin/lib/evidence-*.sh"
      - ".github/workflows/evidence-run.yml"
  push:
    branches: [main]
    paths:
      - "crates/luggage/**"
      - "crates/record-evidence/**"
      - "crates/containers-common/**"
      - "base-images/**"
      - "bin/ingest-evidence.sh"
      - "bin/ingest-evidence-batch.sh"
      - "bin/lib/evidence-*.sh"
      - ".github/workflows/evidence-run.yml"

permissions:
  contents: read

# Serialize runs on the same ref so two pushes to main don't race to open
# duplicate containers-db PRs. Don't cancel an in-flight run — an
# interrupted ingest could leave a half-pushed branch behind.
concurrency:
  group: evidence-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  # Resolve the matrix and the effective dry-run flag once, so the
  # `evidence` job body is event-agnostic:
  #   - workflow_dispatch: a single leg built from the inputs; dry-run
  #     follows the `dry_run` input.
  #   - pull_request: the enumerated pilot legs in dry-run (validate only).
  #   - push → main: every pending catalog cell (bin/lib/evidence-matrix.sh)
  #     with a real ingest; pull_request runs the same cells in dry-run.
  setup:
    name: Resolve matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      dry_run: ${{ steps.gen.outputs.dry_run }}
      has_cells: ${{ steps.gen.outputs.has_cells }}
    steps:
      # The push/PR matrix is derived from the vendored catalog and the
      # base-images tree (bin/lib/evidence-matrix.sh), so it needs both.
      - name: Checkout catalog and base-image tree
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            bin/lib/evidence-epoch.sh
            bin/lib/evidence-matrix.sh
            base-images
            crates/luggage/testdata/catalog

      # A PR's base-images tree can add tuples whose images are not published
      # until it merges (PR builds never push), so a PR's "available" set is
      # the BASE branch's tree, i.e. what can actually be pulled.
      - name: Checkout base branch base-image tree (PRs)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: _base
          sparse-checkout: base-images

      # Pending-ness is judged against PUBLISHED evidence (#1319): the
      # vendored catalog never receives tested[] rows, so reading it made every
      # push re-test the same oldest cells. A failed checkout fails this job
      # rather than falling back to "everything pending". containers-db is
      # public, so the default token reads it (ingest's PAT is for writes).
      - name: Checkout published evidence (containers-db)
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          repository: joshjhall/containers-db
          path: _db
          sparse-checkout: tools

      # A previous run's ingest PR (evidence/batch/<run-id>) is often still
      # awaiting auto-merge when the next push resolves its matrix, so its rows
      # are not on main yet. The rows each open one ADDS over its merge-base
      # (evidence_pr_rows) join the evidence source, so those cells count as
      # covered instead of being re-queued. Not its whole tools/ tree: that
      # carries main's rows as of its branch point, so a pass row since
      # removed on main would be re-asserted (#1327).
      # evidence_open_prs keeps only same-repo PRs by the ingest identity
      # under 24h old. The PRs are listed BEFORE main is re-fetched, so a PR
      # that merges in between is on the main read rather than in neither.
      # refs/pull/N/head survives a close, so each PR's state is re-read after
      # its fetch and a CLOSED one is skipped. A MERGED one counts only while
      # its merge commit is not yet in the main read. A close after that
      # re-read still counts for this one run; that seconds-wide window is
      # accepted.
      # A failed listing, state read, or fetch fails the job, like the
      # checkout above.
      - name: Collect open evidence PRs (containers-db)
        id: db_sources
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # shellcheck source=bin/lib/evidence-matrix.sh
          source bin/lib/evidence-matrix.sh
          LIST=$(gh pr list --repo joshjhall/containers-db --state open --limit 1000 \
            --json number,headRefName,isCrossRepository,author,createdAt)
          if [ "$(jq length <<<"$LIST")" -ge 1000 ]; then
            echo "containers-db has 1000+ open PRs; the listing may be truncated" >&2
            exit 1
          fi
          PRS=$(evidence_open_prs "$(date -u +%s)" <<<"$LIST")
          git -C _db fetch --quiet --depth 1 origin main
          git -C _db checkout --quiet --detach FETCH_HEAD
          # Merge-bases are taken against THIS main, not the moving ref: a PR
          # that merged after this fetch has its head on live main, so a live
          # merge-base would equal its head and its rows would be in neither.
          MAIN_SHA=$(git -C _db rev-parse HEAD)
          SOURCES="$PWD/_db"
          for n in $PRS; do
            git -C _db fetch --quiet --depth 1 origin "refs/pull/$n/head:refs/evidence-pr/$n"
            PR_STATE=$(gh pr view "$n" --repo joshjhall/containers-db \
              --json state,mergeCommit -q '"\(.state) \(.mergeCommit.oid // "-")"')
            read -r STATE MERGE_SHA <<<"$PR_STATE"
            if [ "$STATE" = CLOSED ]; then
              echo "containers-db#$n closed without merging since it was listed; its rows do not count"
              continue
            fi
            # Merged before the main fetch: its rows are on MAIN_SHA already. A
            # squash's head is not an ancestor of main, so its merge-base is the
            # old branch point and its stale copies would be re-asserted.
            if [ "$STATE" = MERGED ]; then
              IN_MAIN=$(gh api "repos/joshjhall/containers-db/compare/$MERGE_SHA...$MAIN_SHA" -q .status)
              if [ "$IN_MAIN" = ahead ] || [ "$IN_MAIN" = identical ]; then
                echo "containers-db#$n merged into the main read; its rows come from main"
                continue
              fi
            fi
            HEAD_SHA=$(git -C _db rev-parse "refs/evidence-pr/$n")
            BASE_SHA=$(gh api "repos/joshjhall/containers-db/compare/$MAIN_SHA...$HEAD_SHA" -q .merge_base_commit.sha)
            git -C _db fetch --quiet --depth 1 origin "$BASE_SHA"
            for side in head base; do
              mkdir -p "_db_pr/$n/$side"
              if [ "$side" = head ]; then REV="$HEAD_SHA"; else REV="$BASE_SHA"; fi
              git -C _db archive "$REV" tools | tar -x --no-same-owner -C "_db_pr/$n/$side"
              if [ -n "$(find "_db_pr/$n/$side" -type l -print -quit)" ]; then
                echo "containers-db#$n tools/ ($side) contains symlinks; refusing it" >&2
                exit 1
              fi
            done
            evidence_pr_rows "_db_pr/$n/base" "_db_pr/$n/head" "_db_pr/$n/rows"
            SOURCES="$SOURCES:$PWD/_db_pr/$n/rows"
            echo "Counting the rows open evidence PR joshjhall/containers-db#$n adds as published evidence"
          done
          echo "sources=$SOURCES" >> "$GITHUB_OUTPUT"

      - name: Generate matrix and dry-run flag
        id: gen
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TOOL: ${{ inputs.tool }}
          INPUT_TOOL_VERSION: ${{ inputs.tool_version }}
          INPUT_TUPLE: ${{ inputs.tuple }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          DB_SOURCES: ${{ steps.db_sources.outputs.sources }}
        run: |
          set -euo pipefail
          # Map an arch token to its build/run plumbing. The tuple is the
          # single source of truth for arch (the row's recorded arch comes
          # from the in-job tuple split); runner/runtime/rust_target are its
          # build-plumbing companions, set together here so `runs-on:` and the
          # toolchain `targets:` can read them at job-eval time. rust_target is
          # the triple luggage/record-evidence are BUILT for, whatever tool the
          # leg installs — go legs carry it too (#1341).
          #   native   → arch-matched runner, no docker --platform.
          #   emulated → ubuntu-latest + QEMU + docker run --platform.
          arch_plumbing() {
            case "$1" in
              amd64) echo "ubuntu-latest native x86_64-unknown-linux-musl" ;;
              arm64) echo "ubuntu-24.04-arm native aarch64-unknown-linux-musl" ;;
              *) echo "Unsupported arch: $1" >&2; return 1 ;;
            esac
          }
          if [ "$EVENT" = "workflow_dispatch" ]; then
            ARCH="${INPUT_TUPLE##*-}"
            # Capture-then-read with an explicit guard so an unsupported arch
            # aborts here with arch_plumbing's clear error. A bare
            # `read < <(arch_plumbing …)` (or an unguarded `$(…)` assignment)
            # swallows the non-zero exit and would emit a matrix with empty
            # runner/runtime/target, failing later with an opaque
            # runner-resolution error instead.
            PLUMBING=$(arch_plumbing "$ARCH") || { echo "Cannot resolve plumbing for arch: $ARCH" >&2; exit 1; }
            read -r RUNNER RUNTIME RUST_TARGET <<< "$PLUMBING"
            MATRIX=$(jq -cn \
              --arg tool "$INPUT_TOOL" \
              --arg version "$INPUT_TOOL_VERSION" \
              --arg tuple "$INPUT_TUPLE" \
              --arg image_tag "$INPUT_IMAGE_TAG" \
              --arg arch "$ARCH" \
              --arg runtime "$RUNTIME" \
              --arg runner "$RUNNER" \
              --arg rust_target "$RUST_TARGET" \
              '{include: [{tool: $tool, version: $version, tuple: $tuple, image_tag: $image_tag, arch: $arch, runtime: $runtime, runner: $runner, rust_target: $rust_target}]}')
            DRY="$INPUT_DRY_RUN"
          else
            # Every pending evidence cell, from the catalog (#1111), for every
            # luggage tool in it (#1341; each tools/<tool>/versions/, so
            # system_package entries are skipped): the newest patch of each
            # minor from the floor up, x each tuple it claims that has a base
            # image, minus cells that already have passing evidence in
            # published containers-db (#1319) or a failure inside the cooldown
            # (#1326). One cap across all tools, under GitHub's 256-job limit;
            # the backlog drains over successive pushes, never-tested cells
            # before failure retries, tools interleaved, oldest versions first.
            # shellcheck source=bin/lib/evidence-matrix.sh
            source bin/lib/evidence-matrix.sh
            rc=0
            AVAILABLE_ROOT="$PWD"
            if [ "$EVENT" = "pull_request" ] && [ -d _base/base-images ]; then
              AVAILABLE_ROOT="$PWD/_base"
            fi
            # Only tuples whose image is actually published (a Dockerfile can
            # land before its image: the publish runs alongside this on merge).
            image_published() {
              docker manifest inspect "${REGISTRY}/${GITHUB_REPOSITORY}/base-$1:latest" >/dev/null 2>&1
            }
            export -f image_published
            export EVIDENCE_PUBLISHED_CHECK=image_published
            # containers-db main plus each open evidence PR (colon-separated).
            # Never empty here: an empty value would read the vendored rows.
            [ -n "$DB_SOURCES" ] || { echo "No published evidence source resolved" >&2; exit 1; }
            export EVIDENCE_TESTED_SOURCE="$DB_SOURCES"
            MATRIX=$(evidence_matrix_all crates/luggage/testdata/catalog "$AVAILABLE_ROOT" latest 200) || rc=$?
            case "$rc" in
              0) ;;
              3)
                echo "::notice::No pending evidence cells; every claimed tuple with a base image is covered."
                MATRIX='{"include":[]}'
                ;;
              *) echo "evidence_matrix failed (exit $rc)" >&2; exit 1 ;;
            esac
            if [ "$EVENT" = "pull_request" ]; then
              DRY="true"
              # A PR only needs to prove the pipeline still works, not
              # re-evidence the backlog: the first pending cell of EACH tool
              # keeps a PR to one runner per tool instead of up to 200 (see
              # evidence_pr_legs for why per tool, #1341).
              MATRIX=$(evidence_pr_legs <<<"$MATRIX")
            else
              DRY="false"
            fi
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "dry_run=$DRY" >> "$GITHUB_OUTPUT"
          if [ "$(jq '.include | length' <<<"$MATRIX")" -gt 0 ]; then
            echo "has_cells=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cells=false" >> "$GITHUB_OUTPUT"
          fi

  # Coverage reconciliation — cross-check every version's `support_matrix`
  # `supported` claims against its `tested[]` evidence rows. Independent of the
  # matrix (no base image, no clone): runs against the vendored testdata
  # catalog so it stays hermetic and fork-safe. Report mode only — it surfaces
  # the claim-vs-evidence gap on every push/PR without blocking, because the
  # pilot produces only `debian-12-amd64` evidence and `--gate` over the real
  # catalog would be red on day one. Promote to `--gate` once the base-image
  # matrix covers the claimed cells. See docs/operations/evidence-runs.md
  # § Coverage reconciliation.
  reconcile:
    name: Reconcile coverage (report)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout containers
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: "1.99"

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: reconcile

      - name: Build luggage
        run: cargo build --release -p luggage

      - name: Reconcile claims against evidence (report)
        run: |
          ./target/release/luggage reconcile \
            --catalog crates/luggage/testdata/catalog

  evidence:
    name: Evidence ${{ matrix.tool }}@${{ matrix.version }} on ${{ matrix.tuple }}
    needs: setup
    # An empty matrix is a hard error in Actions; skip when nothing is pending.
    if: needs.setup.outputs.has_cells == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # issues: write is needed for the fail-row tracking-issue step below. Scoped
    # to this job (not the workflow root) so `setup` and `reconcile` stay
    # contents:read. The issue is filed on this repo, so the default
    # GITHUB_TOKEN suffices — no PAT (unlike the cross-repo ingest).
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    env:
      INPUT_TOOL: ${{ matrix.tool }}
      INPUT_TOOL_VERSION: ${{ matrix.version }}
      INPUT_TUPLE: ${{ matrix.tuple }}
      INPUT_IMAGE_TAG: ${{ matrix.image_tag }}
      # Arch plumbing from the leg (see the setup job's arch_plumbing). Read
      # into env rather than interpolated into run: scripts, per the file's
      # coordinates-into-env guardrail. ARCH here drives the build target and
      # the docker --platform flag; the row's recorded arch comes separately
      # from the tuple split (steps.tuple.outputs.arch) so the tuple stays the
      # single source of truth for evidence data.
      ARCH: ${{ matrix.arch }}
      RUNTIME: ${{ matrix.runtime }}
      RUST_TARGET: ${{ matrix.rust_target }}
    steps:
      - name: Checkout containers
        uses: actions/checkout@v4

      - name: Install Rust toolchain (musl target)
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable branch
        with:
          toolchain: "1.99"
          targets: ${{ matrix.rust_target }}

      - name: Install musl linker
        run: |
          sudo apt-get install -y --no-install-recommends musl-tools
          # Emulated arm64 cross-compiles aarch64 musl from an amd64 host, so
          # it needs an aarch64 cross-linker. A native arm64 leg builds on an
          # arm64 runner (no cross-compile) and skips this. amd64 never needs it.
          if [ "$RUNTIME" = "emulated" ] && [ "$ARCH" = "arm64" ]; then
            sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu
          fi

      - name: Cache cargo
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # Per-arch key so amd64 and arm64 build artifacts don't collide.
          key: musl-${{ matrix.arch }}

      # Build statically against musl so the produced binaries run inside
      # any base image (glibc 2.36 / 2.31 / alpine / RHEL) without a
      # glibc-version match against the runner. luggage's TLS path uses
      # rustls (pure Rust), so no native-tls/openssl configuration is
      # needed for the static link.
      - name: Build luggage and record-evidence (static musl)
        run: |
          # Cargo reads CARGO_TARGET_<triple>_LINKER only for the triple being
          # built, so the aarch64 linker only matters on an arm64 leg — and its
          # value differs by runtime: the emulated (cross-compile) leg needs the
          # aarch64 cross-gcc, while a native arm64 leg links with musl-gcc from
          # musl-tools (gcc-aarch64-linux-gnu is not installed there). amd64
          # sets nothing, leaving its build byte-identical to the pre-arch path.
          if [ "$ARCH" = "arm64" ]; then
            if [ "$RUNTIME" = "emulated" ]; then
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc
            else
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
            fi
          fi
          cargo build --release --target "$RUST_TARGET" \
            -p luggage -p record-evidence
          /bin/ls -l "target/$RUST_TARGET/release/luggage" \
                     "target/$RUST_TARGET/release/record-evidence"

      - name: Resolve base image digest
        id: digest
        env:
          REPO: ${{ github.repository }}
        run: |
          IMAGE="${REGISTRY}/${REPO}/base-${INPUT_TUPLE}:${INPUT_IMAGE_TAG}"
          docker pull "$IMAGE"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE" | awk -F'@' '{print $2}')
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Resolved digest is not a sha256:<64 hex>: $DIGEST" >&2
            exit 1
          fi
          IMAGE_REF="${IMAGE%:*}"
          {
            echo "digest=$DIGEST"
            echo "image_ref=$IMAGE_REF"
          } >> "$GITHUB_OUTPUT"

      - name: Derive tuple coordinates
        id: tuple
        run: |
          # Split debian-12-amd64 -> os=debian os_version=12 arch=amd64
          IFS='-' read -ra parts <<< "$INPUT_TUPLE"
          if [ "${#parts[@]}" -ne 3 ]; then
            echo "Unexpected tuple shape: $INPUT_TUPLE (want <os>-<os_version>-<arch>)" >&2
            exit 1
          fi
          {
            echo "os=${parts[0]}"
            echo "os_version=${parts[1]}"
            echo "arch=${parts[2]}"
          } >> "$GITHUB_OUTPUT"

      # Install against the catalog luggage was built and shipped with (the
      # vendored snapshot in this checkout), not containers-db main. Reading
      # main raced every DB change that needed a matching luggage change: the
      # window between the two merges recorded false failures for every cell
      # (#1164: util_linux unknown to the old luggage). containers-db is only
      # the ingest target, written by the collect job below.
      - name: Check the version is in the vendored catalog
        run: |
          test -f "crates/luggage/testdata/catalog/tools/${INPUT_TOOL}/versions/${INPUT_TOOL_VERSION}.json" || {
            echo "vendored catalog missing tools/${INPUT_TOOL}/versions/${INPUT_TOOL_VERSION}.json" >&2
            exit 1
          }

      # Register binfmt handlers so the amd64 runner can run a foreign-arch
      # (arm64) container. Only the emulated path needs this; a native leg
      # runs on an arch-matched runner and skips it.
      - name: Set up QEMU (emulated legs)
        if: ${{ matrix.runtime == 'emulated' }}
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Run luggage install inside the base image
        env:
          IMAGE: ${{ steps.digest.outputs.image_ref }}@${{ steps.digest.outputs.digest }}
        run: |
          mkdir -p out
          # Emulated legs pin the container platform so QEMU runs the foreign
          # arch; native legs leave the array empty (no --platform), which
          # makes the amd64 path byte-identical to the pre-arch behavior.
          PLATFORM_FLAGS=()
          if [ "$RUNTIME" = "emulated" ]; then
            PLATFORM_FLAGS=(--platform "linux/${ARCH}")
          fi
          # We don't fail the workflow on install failure — luggage's
          # --json-report writes a failure row too, which is the whole
          # point of an evidence run. The row's `result` field carries
          # the verdict.
          # Strict dependency handling is the default (issue #644): an
          # unmapped catalog dep id makes `luggage install` hard-fail and
          # write a failure row. That is intentional and relied upon to
          # surface catalog drift — do NOT add --allow-unknown-deps below.
          set +e
          # --user 0: base image defaults to a non-root USER (security
          # hardening), but luggage needs root to install rust system-wide
          # via rustup-init (writes to /usr/local/cargo) and to write the
          # report file to the runner-owned /out mount. Overriding USER
          # here is the "this is an install test, not a service" exception.
          # The mounted luggage binary runs INSIDE the container, so it is
          # built for the container arch ($RUST_TARGET) in both runtime modes.
          #
          # luggage's own --user runner, though, makes the install method and
          # post-install steps run as the base image's non-root user via `su`,
          # exactly as lib/features/rust.sh does in a real container. Without
          # it evidence installed as root and never exercised that path, which
          # hid an Alpine bug (#1165: post-install could not find `rustup`
          # under su's login PATH) while every Alpine cell passed.
          docker run --rm \
            "${PLATFORM_FLAGS[@]}" \
            --user 0 \
            -v "$PWD/target/$RUST_TARGET/release/luggage:/usr/local/bin/luggage:ro" \
            -v "$PWD/crates/luggage/testdata/catalog:/catalog:ro" \
            -v "$PWD/out:/out" \
            -e CONTAINERS_DB=/catalog \
            "$IMAGE" \
            luggage install "${INPUT_TOOL}@${INPUT_TOOL_VERSION}" --user runner --json-report /out/luggage-report.json
          INSTALL_RC=$?
          set -e
          echo "luggage exited with $INSTALL_RC"
          test -s out/luggage-report.json || {
            echo "luggage did not write a report" >&2
            exit 1
          }

      - name: Build evidence row
        env:
          IMAGE_REF: ${{ steps.digest.outputs.image_ref }}
          IMAGE_DIGEST: ${{ steps.digest.outputs.digest }}
          CI_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OS: ${{ steps.tuple.outputs.os }}
          OS_VERSION: ${{ steps.tuple.outputs.os_version }}
          ARCH: ${{ steps.tuple.outputs.arch }}
        run: |
          "./target/$RUST_TARGET/release/record-evidence" \
            --luggage-report out/luggage-report.json \
            --image-ref "$IMAGE_REF" \
            --image-digest "$IMAGE_DIGEST" \
            --ci-run "$CI_RUN" \
            --os "$OS" \
            --os-version "$OS_VERSION" \
            --arch "$ARCH" \
            > out/evidence-row.json
          jq . out/evidence-row.json

      # Surface the recorded verdict as step outputs so the fail-row
      # tracking-issue step can gate on it. The row's `result` and optional
      # `error_class` are written by record-evidence (see
      # crates/record-evidence/src/lib.rs); a pass/skip row has no error_class,
      # so default it to "unknown" to keep the issue body well-formed.
      - name: Read evidence verdict
        id: verdict
        run: |
          set -euo pipefail
          # Verdict read+sanitize lives in a sourced helper so it is unit-tested
          # offline (tests/unit/evidence-verdict.sh). The helper strips CR/LF (a
          # GITHUB_OUTPUT key=value injection vector) and validates result
          # against the pass|fail|skip enum; we redirect its `result=`/
          # `error_class=` lines into $GITHUB_OUTPUT here at the workflow boundary.
          source "$GITHUB_WORKSPACE/bin/lib/evidence-issue.sh"
          read_evidence_verdict out/evidence-row.json >> "$GITHUB_OUTPUT"

      # The row is a bare TestEntry; the collect job also needs to know which
      # tool/version file it belongs to, so wrap it in an envelope. Named per
      # CELL (tool, version, tuple): with many versions per tuple, a per-tuple
      # name made parallel legs collide (upload-artifact@v4 rejects a reused
      # name). The collect job downloads every evidence-row-* artifact.
      - name: Wrap row for batch ingest
        run: |
          jq --arg tool "$INPUT_TOOL" --arg version "$INPUT_TOOL_VERSION" \
            '{tool: $tool, version: $version} + .' out/evidence-row.json > out/evidence-envelope.json

      - name: Upload evidence row
        uses: actions/upload-artifact@v4
        with:
          name: evidence-row-${{ matrix.tool }}-${{ matrix.version }}-${{ matrix.tuple }}
          path: out/evidence-envelope.json
          if-no-files-found: error

  # One PR per run. Cells only record and upload; this job merges every row
  # into containers-db with the shared dedup policy, opens ONE PR, and
  # auto-merges it. Per-cell PRs (up to 200 per push, conflicting on shared
  # version files) and per-cell tracking issues are gone. Runs even when some
  # cells failed: a fail row is evidence too.
  collect:
    name: Ingest evidence (one PR)
    needs: [setup, evidence]
    if: ${{ always() && needs.setup.outputs.has_cells == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout containers
        uses: actions/checkout@v4

      - name: Download evidence rows
        uses: actions/download-artifact@v4
        with:
          pattern: evidence-row-*
          path: rows
          merge-multiple: false

      - name: Install just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0

      - name: Install ajv (db-validate)
        run: npm install --no-save ajv-cli@5.0.0 ajv-formats@3.0.1

      - name: Ingest (dry-run)
        if: ${{ needs.setup.outputs.dry_run == 'true' }}
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ./bin/ingest-evidence-batch.sh --rows-dir rows --db-path "$PWD/_db" \
            --run-id "$RUN_ID" --run-url "$RUN_URL" --dry-run

      - name: Ingest (one PR, auto-merged)
        if: ${{ needs.setup.outputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.CONTAINERS_DB_PAT }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "CONTAINERS_DB_PAT secret is not configured (docs/operations/evidence-runs.md, Auth model)." >&2
            exit 1
          fi
          git config --global "url.https://x-access-token:${GH_TOKEN}@github.com/.insteadOf" "https://github.com/"
          ./bin/ingest-evidence-batch.sh --rows-dir rows --db-path "$PWD/_db" \
            --run-id "$RUN_ID" --run-url "$RUN_URL"

      # ONE tracking issue per run listing every fail row, instead of one issue
      # per failing cell (a broken luggage build opened 47, then 83). Best-effort.
      - name: Open tracking issue for fail rows
        if: ${{ needs.setup.outputs.dry_run != 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/bin/lib/evidence-issue.sh"
          open_run_tracking_issue rows "$RUN_URL"
