name: Auto-Merge Version Updates

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  auto-merge:
    name: Auto-Merge Version Update PRs
    runs-on: ubuntu-latest
    # Only run on PRs created by the version-check workflow
    if: |
      github.event.pull_request.user.login == 'github-actions[bot]' &&
      contains(github.event.pull_request.labels.*.name, 'version-update')

    permissions:
      contents: write
      pull-requests: write
      checks: read

    steps:
      - name: Wait for CI checks
        uses: lewagon/wait-on-check-action@e106e5c43e8ca1edea6383a39a01c5ca495fd812 # v1.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # Must match ci.yml's `test` job `name:` EXACTLY. This is a third
          # copy of that string (the others are ci.yml itself and
          # .github/required-checks.txt). wait-on-check-action polls until its
          # timeout for a name that never appears, so a rename applied
          # everywhere but here is a SILENT STALL of version-update
          # auto-merges, not an error (#910). tests/unit/required-checks.sh
          # asserts every check-name literal in .github/workflows/ resolves to
          # exactly one real job.
          check-name: "Run Tests"
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 30

      - name: Auto-merge PR
        uses: pascalgn/automerge-action@ecf84b72b5ef0dc9d40c4094b724ecf85b3b416a # v0.15.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Merge method: merge, squash, or rebase
          method: squash
          # Delete branch after merge
          delete_branch: true
          # Custom commit message for squash
          commit_message_template: |
            chore: automated version updates (#${{ github.event.pull_request.number }})

            Auto-merged by GitHub Actions after CI checks passed.

            Co-authored-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
