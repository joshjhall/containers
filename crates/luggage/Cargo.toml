[package]
name = "luggage"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Catalog loader and version/platform resolver for the containers build system"
publish = false

[lints]
workspace = true

[dependencies]
containers-common = { workspace = true }
clap = { workspace = true, features = ["env"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
lzma-rs = "0.3"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
shell-words = "1"
tar = "0.4"
tempfile = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ureq = { version = "3", default-features = false, features = ["rustls"] }
pgp = "0.21"

# Safe `kill_process_group` for the version-probe timeout (#1352) — the
# workspace forbids unsafe_code, so `libc::killpg` is unavailable.
# signal-hook kills live probe groups on SIGINT/SIGTERM (#1370) through a safe
# API. On 0.4 since #1508's dependency refresh; crossterm (via stibbons) still
# pins 0.3, so the lockfile carries both until crossterm moves.
[target.'cfg(unix)'.dependencies]
rustix = { workspace = true }
signal-hook = { version = "0.4", default-features = false, features = ["iterator"] }

[dev-dependencies]
serial_test = "4"
tempfile = { workspace = true }
