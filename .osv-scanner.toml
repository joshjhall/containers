# osv-scanner suppressions.
#
# Every entry needs a reason and an expiry. The quarterly review
# (.github/workflows/quarterly-review.yml) prunes this file — an expired entry
# is meant to come back as a failure, not be renewed on autopilot.

# The httparty 0.20.0 suppressions (GHSA-hm5p-x4rq-38w4, GHSA-5pq7-52mg-hr42)
# were removed in #963: gitlab-triage 1.53.1 relaxed its pin to
# `httparty (>= 0.21.0, < 1.0)`, so .gitlab/triage/Gemfile.lock now resolves
# 0.24.2 — past both fixes. Nothing to suppress.

# ---------------------------------------------------------------------------
# atomic-polyfill 1.0.3 — embedded-target-only, via octarine's phonenumber
# ---------------------------------------------------------------------------
# RUSTSEC-2023-0089 is an unmaintained advisory: upstream archived the repo and
# there is no successor version, so there is nothing to upgrade to.
#
# The crate is not compiled by anything we ship. heapless 0.7 declares
# atomic-polyfill only under embedded target predicates (thumbv6m-none-eabi,
# riscv32*, avr, xtensa). `cargo tree -i atomic-polyfill --target <triple>`
# prints nothing for every triple in release-binaries.yml (x86_64/aarch64 x
# linux-musl / apple-darwin / pc-windows-msvc) or for the glibc container host;
# it only resolves under `--target all`. osv-scanner reads the lockfile without
# target predicates, so it sees the entry regardless.
#
# No upgrade path exists from our side: the chain is
# octarine -> phonenumber 0.3 -> postcard 1.1.3 (build+normal) -> heapless 0.7,
# and postcard's newest release still requires heapless ^0.7.
#
# Mirrored in deny.toml's [advisories] ignore list — keep the two in sync.
# Revisit when phonenumber drops postcard, or postcard moves to heapless 0.9.

[[IgnoredVulns]]
id = "RUSTSEC-2023-0089"
ignoreUntil = 2026-12-31
reason = "atomic-polyfill unmaintained; embedded-target-only via heapless 0.7, never compiled on any target we build. No upgrade path (postcard 1.1.3 still pins heapless ^0.7)."

# ---------------------------------------------------------------------------
# block-buffer 0.10.4 — via digest 0.10 (sha2, octarine, RustCrypto)
# ---------------------------------------------------------------------------
# GHSA-qwgh-2vcv-g2f7: a panic inside a caller-supplied block-compression
# callback, caught and followed by reuse of the same buffer, can leave its
# cursor byte corrupt and allow out-of-bounds access. Fixed only in 0.12.1;
# no 0.10.x patch exists, so `cargo update` cannot clear it — the whole
# digest 0.10 family has to move to 0.11 (#1522).
#
# Our use is one-shot hashing (sha256/sha512 of downloads, digests inside
# signature verification). Those compression functions do not panic, and
# nothing in the workspace catches a panic and reuses a hasher.
#
# Not yet in the RustSec database, so cargo-deny does not flag it and there is
# no deny.toml entry to mirror. Add one if a RUSTSEC id is assigned.

[[IgnoredVulns]]
id = "GHSA-qwgh-2vcv-g2f7"
ignoreUntil = 2027-01-31
reason = "block-buffer 0.10 cursor corruption needs a caught panic inside a compression callback; we only do one-shot sha2/digest hashing. Fix needs digest 0.11 (#1522)."

# ---------------------------------------------------------------------------
# rsa 0.9.10 + crypto-bigint 0.5.5 — via pgp 0.21, luggage tier-1 GPG (#1508)
# ---------------------------------------------------------------------------
# RUSTSEC-2023-0071 (Marvin) and RUSTSEC-2026-0387 (non-constant-time
# arithmetic) are both timing side channels that leak a SECRET operand: an
# RSA private key during decryption/signing, or secret integers in
# constant-time-intended bignum ops.
#
# luggage uses pgp only to verify detached signatures against PUBLIC keys
# committed to the catalog (keyrings/*.asc). It loads no secret key, decrypts
# nothing and signs nothing, so neither channel has a secret to leak. Secret
# keys exist only in luggage's unit tests, generated from a fixed seed.
#
# No upgrade path from our side: rsa has no constant-time release, and pgp
# 0.21 pins elliptic-curve 0.13, which requires crypto-bigint 0.5.
#
# Mirrored in deny.toml's [advisories] ignore list — keep the two in sync.
# Revisit when pgp moves to rsa 0.10 / elliptic-curve 0.14.

[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
ignoreUntil = 2027-04-30
reason = "rsa Marvin timing attack needs a secret-key operation; luggage only verifies signatures with pinned public keys (pgp 0.21, tier 1, #1508)."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0387"
ignoreUntil = 2027-04-30
reason = "crypto-bigint 0.5 non-constant-time ops leak secret operands; luggage only verifies signatures with pinned public keys (pgp 0.21, tier 1, #1508)."
