# cargo-deny configuration — runs under `just deny`, `just security-scan`,
# the lefthook pre-push hook, and the scheduled security-scan workflow.
#
# Tuning: raise individual exceptions (skip a single crate, allow a single
# license) instead of widening whole categories. Note the reason inline when
# the "why" isn't obvious from the crate name.

[graph]
all-features = true

[output]
feature-depth = 1

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Advisory suppressions. Same contract as .osv-scanner.toml: every entry needs
# a reason, and the same advisory must be suppressed in both files or the two
# gates disagree.
ignore = [
  # atomic-polyfill (unmaintained, archived upstream, no successor version).
  # Reached only via octarine -> phonenumber -> postcard -> heapless 0.7, and
  # heapless declares atomic-polyfill ONLY for embedded targets
  # (thumbv6m-none-eabi, riscv32*, avr, xtensa) — verified with
  # `cargo tree -i atomic-polyfill --target <triple>`, which prints nothing for
  # every triple we build (the six release-binaries targets plus the glibc
  # host). No target we ship ever compiles this crate.
  #
  # There is no upgrade path from here: postcard's newest release (1.1.3) still
  # requires heapless ^0.7, so the dependency cannot be bumped from our side.
  # Revisit when phonenumber drops postcard or postcard moves to heapless 0.9.
  { id = "RUSTSEC-2023-0089", reason = "unmaintained; embedded-target-only via heapless 0.7, never compiled on any target we build. See #802-style note in .osv-scanner.toml." },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
]
confidence-threshold = 0.8
exceptions = [
  # Mozilla root CA bundle pulled in via rustls-platform-verifier.
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
  # Mozilla root CA bundle pulled in via ureq's TLS feature (luggage HTTP).
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates are marked `publish = false`; this allows their
# `{ workspace = true }` deps (which resolve to `"*"` in cargo-deny's view)
# without weakening the wildcard check for published crates.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []

# Duplicate-version exceptions.
#
# Every entry below is a *transitive* duplicate we cannot collapse from this
# workspace: two dependencies we don't own pull incompatible major versions of
# a shared crate. They're listed explicitly (with a version bound) rather than
# silenced wholesale, so a duplicate from a *new* cause still warns and gets
# looked at. Re-check these when octarine or the listed roots upgrade — drop
# the entry once the range no longer matches anything, which cargo-deny
# reports as an `unmatched-skip` warning.
skip = [
  # --- RustCrypto trait-generation split -------------------------------
  # As of octarine v0.3.0-beta.7 its AEAD/KDF stack itself moved to the
  # digest 0.11 generation (aes-gcm 0.11, chacha20poly1305 0.11, argon2 0.6,
  # x25519-dalek 3), but two leaf crates it depends on have not: bs58 0.5
  # (base58check for BTC address validation) is on sha2 0.10, and ml-kem 0.3
  # (post-quantum KEM) is on sha3 0.11. Our own hashing (containers-common,
  # luggage) uses sha2 0.11. Collapses when bs58 and ml-kem cut releases
  # against the 0.11 generation.
  { crate = "block-buffer:<0.12", reason = "digest 0.10 generation via octarine's bs58 -> sha2 0.10" },
  { crate = "crypto-common:<0.2", reason = "digest 0.10 generation via octarine's bs58 -> sha2 0.10" },
  { crate = "digest:<0.11", reason = "digest 0.10 generation via octarine's bs58 -> sha2 0.10" },
  { crate = "cpufeatures:<0.3", reason = "digest 0.10 generation via octarine's bs58 -> sha2 0.10" },
  { crate = "sha2:<0.11", reason = "bs58 0.5 (octarine's base58check) is on sha2 0.10; ours is 0.11" },
  { crate = "sha3:<0.12", reason = "ml-kem 0.3 (octarine's PQ KEM) is on sha3 0.11; octarine itself is on 0.12" },

  # --- rand / getrandom generation split -------------------------------
  # governor 0.10 (octarine's rate limiter) is on rand 0.9; octarine and
  # atomic-write-file are on rand 0.10. ring (rustls) pins getrandom 0.2.
  { crate = "rand:<0.10", reason = "governor 0.10 pins rand 0.9" },
  { crate = "rand_core:<0.10", reason = "governor 0.10 (0.9) and octarine's x25519-dalek/argon2 (0.6)" },
  { crate = "getrandom:<0.4", reason = "ring pins getrandom 0.2; governor's rand 0.9 pins 0.3" },

  # --- hashbrown ---------------------------------------------------------
  # dashmap 6 (0.14) and governor 0.10 (0.16), both reached through octarine,
  # against indexmap 2's 0.17.
  { crate = "hashbrown:<0.17", reason = "dashmap 6 and governor 0.10 lag indexmap's hashbrown" },

  # --- proc-macro helper split -------------------------------------------
  # local-ip-address -> neli -> derive_builder 0.20 uses darling 0.20 (syn 2);
  # octarine-derive uses darling 0.24. syn 2 vs 3 is the ecosystem-wide
  # proc-macro migration currently in flight.
  { crate = "darling:<0.24", reason = "derive_builder 0.20 via neli/local-ip-address" },
  { crate = "darling_core:<0.24", reason = "derive_builder 0.20 via neli/local-ip-address" },
  { crate = "darling_macro:<0.24", reason = "derive_builder 0.20 via neli/local-ip-address" },
  { crate = "syn:<3", reason = "ecosystem mid-migration from syn 2 to syn 3" },

  # --- target-gated, never co-compiled -----------------------------------
  # These only build on Windows / UEFI targets. Multiple versions coexist in
  # the lockfile but no single target ever compiles more than one.
  { crate = "windows-sys:<0.61", reason = "target-gated (Windows only); versions never co-compile" },
  { crate = "r-efi:<6", reason = "target-gated (UEFI only); versions never co-compile" },

  # --- octarine's phonenumber stack ---------------------------------------
  # phonenumber 0.3 (octarine's libphonenumber port) brings regex-cache, which
  # is still on the regex 1.5-era regex-syntax 0.6.
  { crate = "regex-syntax:<0.8", reason = "regex-cache 0.2 via octarine's phonenumber" },
  # reqwest/hyper-util are on base64 0.22; octarine itself is on 0.23.
  { crate = "base64:<0.23", reason = "hyper-util/reqwest lag octarine's base64 0.23" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Workspace git dependency (see Cargo.toml).
allow-git = ["https://github.com/joshjhall/octarine"]
