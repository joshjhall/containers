# cargo-deny configuration — runs under `just deny`, `just security-scan`,
# the lefthook pre-push hook, and the scheduled security-scan workflow.
#
# Tuning: raise individual exceptions (skip a single crate, allow a single
# license) instead of widening whole categories. Note the reason inline when
# the "why" isn't obvious from the crate name.

[graph]
all-features = true

[output]
feature-depth = 1

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
# Advisory suppressions. Same contract as .osv-scanner.toml and
# .cargo/audit.toml: every entry needs a reason, and the same advisory must be
# suppressed in all three files or the gates disagree
# (tests/unit/advisory-ignore-sync.sh).
ignore = [
  # rsa 0.9 (Marvin) and crypto-bigint 0.5 (non-constant-time arithmetic),
  # both reached only through pgp 0.21 for luggage's tier-1 verification
  # (#1508). Each is a timing side channel that leaks a SECRET operand.
  # luggage only ever verifies signatures against public keys from the pinned
  # catalog keyrings — it loads no secret key, decrypts nothing, and signs
  # nothing — so there is no secret for either channel to leak. (Secret keys
  # appear only in luggage's unit tests, generated from a fixed seed.)
  # No fix is reachable from our side: rsa has no constant-time release yet,
  # and pgp 0.21 pins the elliptic-curve 0.13 line that requires
  # crypto-bigint 0.5. Revisit when pgp moves to rsa 0.10 / elliptic-curve 0.14.
  { id = "RUSTSEC-2023-0071", reason = "rsa Marvin timing attack needs a secret-key operation; luggage only verifies with public keys (pgp 0.21, tier 1, #1508). See .osv-scanner.toml." },
  { id = "RUSTSEC-2026-0387", reason = "crypto-bigint 0.5 non-constant-time ops leak secret operands; luggage only verifies with public keys (pgp 0.21, tier 1, #1508). See .osv-scanner.toml." },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.8
exceptions = [
  # Mozilla root CA bundle pulled in via ureq's TLS feature (luggage HTTP).
  { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates are marked `publish = false`; this allows their
# `{ workspace = true }` deps (which resolve to `"*"` in cargo-deny's view)
# without weakening the wildcard check for published crates.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []

# Duplicate-version exceptions.
#
# Every entry below is a *transitive* duplicate we cannot collapse from this
# workspace: two dependencies we don't own pull incompatible major versions of
# a shared crate. They're listed explicitly (with a version bound) rather than
# silenced wholesale, so a duplicate from a *new* cause still warns and gets
# looked at. Re-check these when the listed roots upgrade — drop
# the entry once the range no longer matches anything, which cargo-deny
# reports as an `unmatched-skip` warning.
skip = [
  # --- RustCrypto trait-generation split -------------------------------
  # pgp 0.21 (luggage's tier-1 signature verification, #1508) and its
  # RustCrypto dependencies (dsa, ed25519-dalek, k256, argon2, aes-gcm, ...)
  # are on the digest 0.10 generation. Our own hashing (containers-common,
  # luggage) uses sha2 0.11. Collapses when pgp moves to the 0.11 generation
  # (#1522).
  { crate = "block-buffer:<0.12", reason = "digest 0.10 generation via pgp 0.21" },
  { crate = "crypto-common:<0.2", reason = "digest 0.10 generation via pgp 0.21" },
  { crate = "digest:<0.11", reason = "digest 0.10 generation via pgp 0.21" },
  { crate = "cpufeatures:<0.3", reason = "digest 0.10 generation via pgp 0.21" },
  { crate = "sha2:<0.11", reason = "pgp 0.21's dsa/ed25519-dalek/k256 are on sha2 0.10; ours is 0.11" },

  # --- getrandom generation split ----------------------------------------
  # pgp's rand_core 0.6 (via crypto-bigint/rsa) pins getrandom 0.2; tempfile
  # is on 0.4.
  { crate = "getrandom:<0.4", reason = "pgp 0.21's rand_core 0.6 pins getrandom 0.2" },

  # --- proc-macro helper split -------------------------------------------
  { crate = "syn:<3", reason = "ecosystem mid-migration from syn 2 to syn 3" },

  # --- target-gated, never co-compiled -----------------------------------
  # These only build on Windows / UEFI targets. Multiple versions coexist in
  # the lockfile but no single target ever compiles more than one.
  { crate = "windows-sys:<0.61", reason = "target-gated (Windows only); versions never co-compile" },
]
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
