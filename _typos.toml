# Spell-check config for the crate-ci/typos binary.
# Docs: https://github.com/crate-ci/typos/blob/master/docs/reference.md

[files]
extend-exclude = [
  "lib/gpg-keys/**",
  # Real publisher keyrings/signatures/manifests (base64 + hex) for luggage's
  # tier-1 tests — see that dir's README.md.
  "crates/luggage/testdata/tier1/*.asc",
  "crates/luggage/testdata/tier1/*.sig",
  "crates/luggage/testdata/tier1/*.txt",
  # Vendored tier-1 trust anchors (mirrored from containers-db keyrings/).
  "crates/luggage/testdata/catalog/keyrings/*.asc",
  "CHANGELOG.md",
  "wizard-port-exploration.md",
  "tests/results/**",
  "target/**",
]

[default.extend-words]
Hashi = "Hashi"
AKS = "AKS"
aks = "aks"
RTO = "RTO"
rto = "rto"
ratatui = "ratatui"
Ratatui = "Ratatui"
fpr = "fpr"
encrypter = "encrypter"
ehr = "ehr"
Jod = "Jod"
ba = "ba"
deprecat = "deprecat"
integrat = "integrat"
updat = "updat"
styl = "styl"
# `mis-` prefix (mis-anchored, mis-step) — typos flags the bare stem otherwise.
mis = "mis"
Mis = "Mis"
